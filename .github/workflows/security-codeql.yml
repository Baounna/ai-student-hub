name: Security - CodeQL

# Re-enabled. This was parked while the repository was private, because code
# scanning needs GitHub Advanced Security there and every run failed on upload
# after doing the full analysis. The repository is public now, where code
# scanning is free, so the checks are real again.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Analysis only. Autobuild runs the checked-out project's own build,
          # which on a pull request is code from a fork; it has no reason to
          # have a git credential sitting in .git/config while it does.
          persist-credentials: false

      # init, autobuild and analyze must stay on ONE version. Dependabot
      # raises a separate PR per action, and merging any of them alone leaves
      # the three mismatched, which CodeQL fails as "configuration error"
      # rather than as a version problem -- PRs #47, #48 and #49 each failed
      # that way. They are grouped in .github/dependabot.yml now so they
      # arrive together; if that grouping is ever removed, bump all three in
      # the same commit by hand.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
