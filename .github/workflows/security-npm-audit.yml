name: Security - npm audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # No install step. `npm audit` resolves the advisory set from
      # package-lock.json alone and gives an identical answer, whereas `npm ci`
      # first runs the install scripts of every package the lockfile names. This
      # workflow runs on `pull_request`, so that lockfile can come from a fork:
      # installing to audit means executing the code under suspicion in order to
      # ask whether it is safe.
      - name: Audit dependencies (high/critical)
        run: npm audit --audit-level=high
