name: Security - npm audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # No install step. `npm audit` resolves the advisory set from
      # package-lock.json alone and gives an identical answer, whereas `npm ci`
      # first runs the install scripts of every package the lockfile names. This
      # workflow runs on `pull_request`, so that lockfile can come from a fork:
      # installing to audit means executing the code under suspicion in order to
      # ask whether it is safe.
      # Two questions, not one, because they have different answers and only one
      # of them is actionable.
      #
      # "Does anything vulnerable reach a reader?" is the question this site has
      # to answer, and it blocks. Production dependencies are next, react,
      # react-dom and @vercel/analytics; a high advisory in any of them is
      # shipped code and stops the build.
      #
      # "Is any build tooling flagged?" is reported and does not block. Today
      # that is seven advisories, all of them braces, reached through
      # eslint-config-next -> @next/eslint-plugin-next -> fast-glob ->
      # micromatch. braces@3.0.3 is simultaneously the latest published release
      # and the version the advisory names, so there is no version to upgrade
      # to: every Next.js project currently has this. Migrating off Tailwind 3
      # removes two of the seven and leaves five, because Next's own ESLint
      # config pulls the same chain -- measured, not assumed.
      #
      # Failing on it would make this job permanently red for something nobody
      # can fix, and a check that can never pass stops being read. That is the
      # failure this repository has already had twice: a watchdog that reported
      # success without running, and a weekly agent that went green while
      # writing nothing. The summary below keeps it visible so the day a patched
      # braces exists, it is picked up.
      - name: Audit shipped dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit build tooling (reported, not blocking)
        if: always()
        run: |
          set +e
          out=$(npm audit --audit-level=high 2>&1)
          count=$(printf '%s' "$out" | grep -oE '[0-9]+ (high|critical) severity' | head -1)
          {
            echo "### Build-tooling advisories"
            echo ""
            if [ -z "$count" ]; then
              echo "None. Shipped dependencies are audited in the blocking step above."
            else
              echo "**$count** in devDependencies. These do not reach a reader —"
              echo "\`npm audit --omit=dev\` is clean, and that is the blocking check."
              echo ""
              echo '```'
              printf '%s' "$out" | tail -n 30
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
