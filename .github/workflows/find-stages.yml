name: Internship Finder

# The board only grew when somebody sat down and typed `npm run add:stage`.
# Postings do not wait for that: fourteen closed in four days on 2026-10-06 and
# 2026-10-10, and nothing was arriving to replace them. This looks for new ones.
#
# It runs with --write, so it DOES add to src/content/stages.json -- but only
# rows whose link it fetched and got an answer from, stamped addedBy feed so the
# page says on each row where it came from.
#
# Every row says "link checked <date>" and the method note promises the link was
# fetched and the page read, not pinged. An agent that published an API listing
# straight to the board would make that false on the day it ran: the board had
# been checked, the link had not. So the fetch is the gate. Whatever it cannot
# settle -- a refusal, a country it could not resolve, a page that reads as
# closed -- stays in the review file and goes to a person, who still has to
# judge the one thing no fetch can: whether the role is what its title says.

on:
  schedule:
    # Thursdays, deliberately offset from the Monday link check. The check
    # removes what died; this proposes what replaces it, and splitting them
    # means a week never passes with the board only shrinking.
    - cron: "15 6 * * 4"
  workflow_dispatch:

concurrency:
  group: ai-student-hub-main-automation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

# next build runs with NODE_ENV=production, which trips the production config
# validation in src/lib/env-validation.ts. Throwaway placeholders so the build
# can be verified; the real values live in the deployment environment and are
# never needed to compile.
#
# This block is why the finder was red from its first scheduled run on 15
# October. CI, the link check and the watchdog all carry it; this workflow was
# written last and did not. Discovery worked and the rows were built, then the
# verify step threw before the commit step it gates -- so the agent has never
# once added a listing from CI, and the failure looked like a finder bug for six
# days while the finder itself was fine.
env:
  SITE_URL: https://ci.invalid
  NEXT_PUBLIC_SITE_URL: https://ci.invalid
  NEXT_PUBLIC_CONTACT_EMAIL: ci@ci.invalid
  NEXT_PUBLIC_LEGAL_NAME: CI Build

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Discovery first, so a company added to the prospects list starts being
      # polled the same week rather than waiting for somebody to notice. A
      # prospect that has no board answers 404 and costs one request.
      - name: Search the employer boards
        id: find
        run: |
          set -o pipefail
          node scripts/find-stages.mjs --discover --write 2>&1 | tee "$RUNNER_TEMP/find.log"
          count=$(node -e "
            const d = require('./docs/agent/stage-candidates.json');
            console.log(d.candidates.length);
          ")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # The agent only ever writes under docs/agent. Staging that path rather
      # than -A is what stops a stray file riding along, which has happened
      # twice in this repository.
      # The board is rendered from this file, so a malformed row would ship a
      # broken page. Typecheck and tests run before anything is pushed.
      - name: Verify the site still builds with the new listings
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit the candidate list
        run: |
          if git diff --quiet -- docs/agent/stage-candidates.md docs/agent/stage-candidates.json src/content/stages.json src/content/stage-sources.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add docs/agent/stage-candidates.md docs/agent/stage-candidates.json src/content/stages.json src/content/stage-sources.json
          git commit -m "chore(stages): add internships from employer job feeds

          Taken from the employers' own applicant-tracking APIs and stamped
          addedBy feed, so the page says on each row where it came from rather
          than claiming a person read it. Candidates whose country could not be
          resolved stay in the review file for a person to place."
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push

      # One issue, reopened and updated — the same reason the watchdog and the
      # link check work that way. A stream of alerts is how the last outage
      # stayed invisible for eighty days.
      - name: Open or update the review issue
        if: always() && steps.find.outputs.count != '0' && steps.find.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Internship candidates waiting for review"
          BODY=$(printf '%s new posting(s) matched internship + AI/cyber and are not on the board yet.\n\nFull list with ready-to-paste commands: [docs/agent/stage-candidates.md](../blob/main/docs/agent/stage-candidates.md)\n\n**Read each page before adding it.** The link has been fetched and answered; whether the role is what its title says is the judgement no fetch makes, and it is why the board is worth reading.\n\n```\n%s\n```\n' \
            "${{ steps.find.outputs.count }}" "$(tail -n 20 "$RUNNER_TEMP/find.log" | tr -d '`')")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
