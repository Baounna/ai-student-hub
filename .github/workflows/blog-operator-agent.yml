name: Blog Operator Agent

on:
  workflow_dispatch:
  schedule:
    # Weekly. These agents are static analysis — no API key, no cost — but their
    # queues drive a 96h freshness check that could never pass while they only
    # ran on demand, and a warning that can never clear is the kind you learn to
    # ignore. That habit is what let a broken lockfile sit for eighty days.
    - cron: "40 7 * * 1"

concurrency:
  group: ai-student-hub-agents
  cancel-in-progress: false

permissions:
  contents: write
  # This workflow sets AGENT_ISSUES_ENABLED on workflow_dispatch and passes
  # GITHUB_TOKEN to the issue sync, but the job token is scoped by this block
  # -- so every create came back 403 and the queue reported nothing wrong.
  # Configured to file issues and unable to file issues is the worst of both.
  issues: write

jobs:
  operator-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh auto-news feed
        run: npm run auto:news

      - name: Run blog operator agent
        run: npm run agent:blog

      - name: Sync operator actions to GitHub Issues
        env:
          # Issues are created only when a human asks for the run. A weekly
          # schedule that opens issues by itself turns into the notification
          # flood that made this repo unreadable before; the scheduled pass just
          # refreshes the reports.
          AGENT_ISSUES_ENABLED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          AGENT_ISSUES_MAX_PER_RUN: "3"
          AGENT_ISSUES_INCLUDE_OPERATOR: "1"
          AGENT_ISSUES_INCLUDE_DESIGN: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run agent:issues

      # The feeds below are rendered by the site, and until now nothing checked
      # them before they shipped.
      #
      # GitHub does not trigger workflows from a push made with the default
      # GITHUB_TOKEN, so CI never runs on a commit this job pushes -- it is not
      # a second pair of eyes arriving later, it is no eyes at all. check-stages
      # and find-stages both run this gate before committing for that reason;
      # the content agents did not, and they push twice a day.
      #
      # The env is step-level and throwaway. next build runs with
      # NODE_ENV=production, which trips src/lib/env-validation.ts; the real
      # values live in the deployment environment and are not needed to compile.
      # Keeping it on the step rather than the workflow means `ci.invalid` cannot
      # leak into the agents that actually fetch things.
      - name: Verify the site still builds with the new content
        run: |
          npm run typecheck
          npm test
          npm run build
        env:
          SITE_URL: https://ci.invalid
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          NEXT_PUBLIC_CONTACT_EMAIL: ci@ci.invalid
          NEXT_PUBLIC_LEGAL_NAME: CI Build

      - name: Commit and push agent outputs
        run: |
          if git diff --quiet -- src/content/auto-news.json docs/agent; then
            echo "No operator changes to commit."
            exit 0
          fi

          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add src/content/auto-news.json docs/agent
          git commit -m "chore(agent): refresh blog operator report and feed"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
