name: Security - Secret scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # gitleaks-action reads PR metadata and writes its summary comment on
  # pull_request events; without this it fails with a 403.
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # gitleaks reads the local history and talks to the API through
          # GITHUB_TOKEN below; it never pushes, so the credential does not
          # need to stay in .git/config.
          persist-credentials: false

      - name: Run gitleaks baseline scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
