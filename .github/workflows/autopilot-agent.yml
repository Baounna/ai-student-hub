name: AI Student Hub Autopilot

on:
  workflow_dispatch:

concurrency:
  group: ai-student-hub-main-automation
  cancel-in-progress: false

permissions:
  contents: write
  # The autopilot runs the same pipeline with AGENT_PIPELINE_INCLUDE_ISSUES=1
  # and had neither this scope nor a token, so its "Issue sync" step listed the
  # queue, wrote the state file and exited 0. This is the run nobody watches --
  # it commits and pushes to main by itself -- so a queue it reports as synced
  # and never files is a backlog with no reader at all. Configured to file
  # issues and unable to file issues is the worst of both.
  issues: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run autonomous BlogOps pipeline
        env:
          AUTOPILOT_PULL: "true"
          AUTOPILOT_COMMIT: "true"
          AUTOPILOT_PUSH: "true"
          AUTOPILOT_MAX_RETRIES: "2"
          AUTOPILOT_BRANCH: ${{ github.ref_name }}
          AUTOPILOT_COMMIT_MESSAGE: "chore(autopilot): continuous blog optimization"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          AGENT_PIPELINE_INCLUDE_AUTO_NEWS: "0"
          AGENT_PIPELINE_INCLUDE_AUTO_TOOLS: "1"
          AGENT_PIPELINE_INCLUDE_OPERATOR: "1"
          AGENT_PIPELINE_INCLUDE_DESIGN: "1"
          AGENT_PIPELINE_INCLUDE_DAILY_CHECKLIST: "1"
          AGENT_PIPELINE_INCLUDE_ISSUES: "1"
          AGENT_PIPELINE_INCLUDE_VERIFY: "1"
          AGENT_PIPELINE_INCLUDE_PUBLIC_CONTENT_VERIFY: "1"
          # Made to work rather than switched off, for the same reason as the
          # scope above: this is the unattended arm, so a queued P1 that is not
          # filed is a P1 nobody will ever be told about. Stated explicitly
          # rather than left to the script's default, because relying on that
          # default is exactly how it came to pass while doing nothing. The sync
          # is idempotent across the autopilot's retries -- it matches an open
          # issue by title and its own state hash -- so a second attempt
          # re-reports the same issues rather than filing duplicates.
          AGENT_ISSUES_ENABLED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run agent:autopilot
