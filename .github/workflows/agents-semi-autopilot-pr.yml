name: AI Student Hub Semi-Autopilot (PR)

on:
  workflow_dispatch:

concurrency:
  group: ai-student-hub-semi-autopilot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  semi-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semi-autopilot pipeline
        env:
          AGENT_PIPELINE_INCLUDE_AUTO_TOOLS: "1"
          AGENT_PIPELINE_INCLUDE_AUTO_NEWS: "1"
          AGENT_PIPELINE_INCLUDE_OPERATOR: "1"
          AGENT_PIPELINE_INCLUDE_DESIGN: "1"
          AGENT_PIPELINE_INCLUDE_DAILY_CHECKLIST: "1"
          AGENT_PIPELINE_INCLUDE_ISSUES: "1"
          AGENT_PIPELINE_INCLUDE_VERIFY: "1"
          AGENT_PIPELINE_INCLUDE_PUBLIC_CONTENT_VERIFY: "1"
          AGENT_PIPELINE_ISSUES_MAX_PER_RUN: "3"
          AGENT_PIPELINE_WRITE_REPORTS: "1"
          # Honestly off, and this is the one of the three where that is the
          # right answer. AGENT_ISSUES_ENABLED defaults to true, so the sync ran
          # with no token, degraded to a dry-run and exited 0 -- the step read as
          # "the queue was filed" while nothing had been. This workflow's whole
          # contract is that it proposes and never acts: it opens a PR instead of
          # pushing, and the permissions block at the top deliberately grants no
          # `issues: write`. Filing issues from here would be the one side effect
          # that escapes the review the PR exists for, and it would do it before
          # anybody has read the diff. The queue still arrives, in the PR's
          # docs/agent/issues-report.md, where it can be read next to the content
          # that produced it. Saying 0 means the report says "disabled" rather
          # than "dry-run", which is the difference between a decision and an
          # accident.
          AGENT_ISSUES_ENABLED: "0"
        run: npm run agent:all

      - name: Run baseline quality checks
        # verify:affiliates reads AFFILIATE_1..5_{NAME,URL,PLACEMENT} from
        # .env.local or .env merged over process.env, and neither of those files
        # is tracked. On a runner it therefore found five empty slots, printed
        # "No valid affiliate links found" plus four missing placements, and
        # exited 1. Under `bash -e` that killed the step on its third line, so
        # verify:agents never ran and the "Create Pull Request" step was skipped
        # because the job had failed -- which means the only step that produces
        # anything a person can look at never ran. This workflow has never once
        # opened its PR, and the failure read as an affiliate problem rather than
        # as a missing config block.
        #
        # scripts/autopilot-agent.mjs already solved this in buildQualityEnv();
        # these are the same throwaway rows it falls back to, chosen so that all
        # four placements the checker requires (home, resources, blog,
        # comparison) are covered. They carry no referral ID on purpose: the
        # checker treats "well-formed but cannot earn" as fine while the site
        # says it earns nothing, so this verifies the wiring without inventing a
        # commercial relationship the site does not have.
        env:
          AFFILIATE_1_NAME: DigitalOcean
          AFFILIATE_1_URL: https://www.digitalocean.com/
          AFFILIATE_1_PLACEMENT: home/resources
          AFFILIATE_2_NAME: Coursera
          AFFILIATE_2_URL: https://www.coursera.org/
          AFFILIATE_2_PLACEMENT: resources/blog
          AFFILIATE_3_NAME: Notion
          AFFILIATE_3_URL: https://www.notion.so/
          AFFILIATE_3_PLACEMENT: blog/resources
          AFFILIATE_4_NAME: GitHub Student Pack
          AFFILIATE_4_URL: https://education.github.com/pack
          AFFILIATE_4_PLACEMENT: comparison/blog
          AFFILIATE_5_NAME: Hugging Face
          AFFILIATE_5_URL: https://huggingface.co/
          AFFILIATE_5_PLACEMENT: home/comparison
        run: |
          npm run lint
          npm run verify:public-content
          npm run verify:affiliates
          npm run verify:agents

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(agent): semi-autopilot daily refresh"
          title: "chore(agent): semi-autopilot daily refresh"
          body: |
            Automated semi-autopilot refresh:
            - auto tools sync
            - auto news sync
            - operator action queue update
            - design quality audit update
            - daily checklist generation
            - issue sync state refresh
            - health/public-content checks
          branch: bot/semi-autopilot
          delete-branch: true
          add-paths: |
            src/content/auto-tools.json
            src/content/auto-news.json
            docs/agent/latest-report.md
            docs/agent/next-actions.json
            docs/agent/issues-state.json
            docs/agent/issues-report.md
            docs/agent/design-report.md
            docs/agent/design-actions.json
            docs/agent/daily-checklist.md
            docs/agent/pipeline-report.md
            docs/agent/pipeline-status.json
            docs/agent/drafts
