name: Blog Writer Agent (LLM)

# AI automation: generates full bilingual article drafts with Claude and opens a
# pull request for human review. It NEVER publishes — drafts only become live
# when a human adds them to src/content/posts.ts.
#
# Setup: add an ANTHROPIC_API_KEY repository secret. Without it, the agent skips
# gracefully and no PR is opened (so the weekly schedule is safe to leave on).

on:
  workflow_dispatch:
    inputs:
      drafts_per_run:
        description: "Number of drafts to generate (0-10)"
        required: false
        default: "2"
  schedule:
    # Mondays 09:00 UTC. No-op when ANTHROPIC_API_KEY is unset.
    - cron: "0 9 * * 1"

concurrency:
  group: ai-student-hub-writer
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  writer-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate LLM drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-8' }}
          AGENT_WRITER_DRAFTS_PER_RUN: ${{ github.event.inputs.drafts_per_run || '2' }}
        run: npm run agent:writer

      - name: Open pull request with new drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The agent exits 0 without ANTHROPIC_API_KEY by design, and then never
          # creates this directory. `git add` on a missing pathspec exits 128, so
          # the workflow failed every week even though nothing was wrong — the
          # agent failed open and the workflow failed closed.
          if [ ! -d docs/agent/drafts/llm ] || [ -z "$(ls -A docs/agent/drafts/llm 2>/dev/null)" ]; then
            echo "No drafts produced — the writer agent skipped (ANTHROPIC_API_KEY not set)."
            exit 0
          fi

          git add -A docs/agent/drafts/llm
          if git diff --cached --quiet -- docs/agent/drafts/llm; then
            echo "No new drafts to propose (nothing fresh this run)."
            exit 0
          fi

          BRANCH="bot/llm-drafts-${{ github.run_id }}"
          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A docs/agent/drafts/llm
          [ -f docs/agent/writer-report.md ] && git add docs/agent/writer-report.md || true
          git commit -m "draft(writer): LLM-generated article drafts for review"
          git push origin "$BRANCH"

          gh pr create \
            --title "LLM article drafts for review" \
            --body "Auto-generated by the Blog Writer Agent (Claude). **Review before publishing.** These are drafts only — they do not go live until added to \`src/content/posts.ts\`. Verify every fact and source link." \
            --base "${GITHUB_REF_NAME:-main}" \
            --head "$BRANCH"
