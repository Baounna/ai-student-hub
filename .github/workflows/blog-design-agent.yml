name: Blog Design Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1"

permissions:
  contents: write

jobs:
  design-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run design agent
        run: npm run agent:design

      - name: Sync design actions to GitHub Issues
        env:
          AGENT_ISSUES_ENABLED: "1"
          AGENT_ISSUES_MAX_PER_RUN: "3"
          AGENT_ISSUES_INCLUDE_OPERATOR: "0"
          AGENT_ISSUES_INCLUDE_DESIGN: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run agent:issues

      - name: Commit and push design outputs
        run: |
          if git diff --quiet -- docs/agent/design-report.md docs/agent/design-actions.json docs/agent/issues-report.md docs/agent/issues-state.json; then
            echo "No design-agent changes to commit."
            exit 0
          fi

          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add docs/agent/design-report.md docs/agent/design-actions.json docs/agent/issues-report.md docs/agent/issues-state.json
          git commit -m "chore(agent): refresh blog design audit"
          git push
