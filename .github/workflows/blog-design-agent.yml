name: Blog Design Agent

on:
  workflow_dispatch:
  schedule:
    # Weekly. These agents are static analysis — no API key, no cost — but their
    # queues drive a 96h freshness check that could never pass while they only
    # ran on demand, and a warning that can never clear is the kind you learn to
    # ignore. That habit is what let a broken lockfile sit for eighty days.
    - cron: "40 8 * * 1"

concurrency:
  group: ai-student-hub-agents
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  design-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run design agent
        run: npm run agent:design

      - name: Sync design actions to GitHub Issues
        env:
          # Issues are created only when a human asks for the run. A weekly
          # schedule that opens issues by itself turns into the notification
          # flood that made this repo unreadable before; the scheduled pass just
          # refreshes the reports.
          AGENT_ISSUES_ENABLED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          AGENT_ISSUES_MAX_PER_RUN: "3"
          AGENT_ISSUES_INCLUDE_OPERATOR: "0"
          AGENT_ISSUES_INCLUDE_DESIGN: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run agent:issues

      - name: Commit and push design outputs
        run: |
          if git diff --quiet -- docs/agent/design-report.md docs/agent/design-actions.json docs/agent/issues-report.md docs/agent/issues-state.json; then
            echo "No design-agent changes to commit."
            exit 0
          fi

          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add docs/agent/design-report.md docs/agent/design-actions.json docs/agent/issues-report.md docs/agent/issues-state.json
          git commit -m "chore(agent): refresh blog design audit"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
