name: Auto News + Tools Agent

on:
  workflow_dispatch:
  schedule:
    # Twice a day. Every 2 hours burned Actions minutes on a private repo and
    # gave 12 chances a day to fail; readers cannot tell the difference.
    - cron: "15 6,18 * * *"

concurrency:
  group: ai-student-hub-main-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run auto news agent
        run: npm run auto:news

      - name: Run auto tools agent
        run: npm run auto:tools

      - name: Commit and push if content changed
        run: |
          if git diff --quiet -- src/content/auto-news.json src/content/auto-tools.json; then
            echo "No auto-content changes to commit."
            exit 0
          fi

          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add src/content/auto-news.json src/content/auto-tools.json
          git commit -m "chore(content): auto-update AI/CS news + tools feeds"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push

      # The submitter reads the sitemap from the live site, so it has to run
      # after Vercel has built the commit we just pushed. Without this wait it
      # reads the previous build and today's articles wait a day to be
      # announced. Three minutes covers a normal build; the step is
      # continue-on-error, so a slow deploy costs us nothing worse than that.
      - name: Wait for the deploy to go live
        run: sleep 180

      # Announce the new URLs to Bing, Yandex, Seznam and Naver. Google is not
      # part of IndexNow and needs Search Console; see docs/OPERATIONS.md.
      - name: Announce new content to search engines
        continue-on-error: true
        env:
          INDEXNOW_SITE_URL: https://ai-student-hub-navy.vercel.app
        run: npm run seo:indexnow
