name: Auto News Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

concurrency:
  group: ai-student-hub-agents
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run auto news agent
        run: npm run auto:news

      - name: Commit and push if content changed
        run: |
          if git diff --quiet -- src/content/auto-news.json; then
            echo "No auto-news changes to commit."
            exit 0
          fi

          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add src/content/auto-news.json
          git commit -m "chore(news): auto-update AI/CS web feed"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
