name: Auto News + Tools Agent

on:
  workflow_dispatch:
  schedule:
    # Twice a day. Every 2 hours burned Actions minutes on a private repo and
    # gave 12 chances a day to fail; readers cannot tell the difference.
    - cron: "15 6,18 * * *"

concurrency:
  group: ai-student-hub-main-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run auto news agent
        run: npm run auto:news

      - name: Run auto tools agent
        run: npm run auto:tools

      # The feeds below are rendered by the site, and until now nothing checked
      # them before they shipped.
      #
      # GitHub does not trigger workflows from a push made with the default
      # GITHUB_TOKEN, so CI never runs on a commit this job pushes -- it is not
      # a second pair of eyes arriving later, it is no eyes at all. check-stages
      # and find-stages both run this gate before committing for that reason;
      # the content agents did not, and they push twice a day.
      #
      # The env is step-level and throwaway. next build runs with
      # NODE_ENV=production, which trips src/lib/env-validation.ts; the real
      # values live in the deployment environment and are not needed to compile.
      # Keeping it on the step rather than the workflow means `ci.invalid` cannot
      # leak into the agents that actually fetch things.
      - name: Verify the site still builds with the new content
        run: |
          npm run typecheck
          npm test
          npm run build
        env:
          SITE_URL: https://ci.invalid
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          NEXT_PUBLIC_CONTACT_EMAIL: ci@ci.invalid
          NEXT_PUBLIC_LEGAL_NAME: CI Build

      - name: Commit and push if content changed
        run: |
          if git diff --quiet -- src/content/auto-news.json src/content/auto-tools.json; then
            echo "No auto-content changes to commit."
            exit 0
          fi

          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add src/content/auto-news.json src/content/auto-tools.json
          git commit -m "chore(content): auto-update AI/CS news + tools feeds"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push

      # The submitter reads the sitemap from the live site, so it has to run
      # after Vercel has built the commit we just pushed. Without this wait it
      # reads the previous build and today's articles wait a day to be
      # announced. Three minutes covers a normal build; the step is
      # continue-on-error, so a slow deploy costs us nothing worse than that.
      - name: Wait for the deploy to go live
        run: sleep 180

      # Announce the new URLs to Bing, Yandex, Seznam and Naver. Google is not
      # part of IndexNow and needs Search Console; see docs/OPERATIONS.md.
      - name: Announce new content to search engines
        continue-on-error: true
        env:
          INDEXNOW_SITE_URL: https://ai-student-hub-navy.vercel.app
        run: npm run seo:indexnow
