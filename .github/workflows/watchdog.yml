name: Watchdog

# The check that runs when nobody is looking.
#
# Everything here exists because a broken lockfile took down every scheduled
# workflow for eighty days without anyone noticing: the failures went to GitHub
# notifications, which had long since become noise.
#
# So this does two things notifications do not. It repairs the one failure that
# caused that outage, verifying the full build before it commits anything. And
# it reports through a SINGLE issue that it updates and closes itself, rather
# than a stream of alerts that trains you to ignore it.

on:
  schedule:
    # Daily, an hour after the morning news run so it sees fresh content.
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: ai-student-hub-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # Read-only, and required: naming any permission sets every unnamed one to
  # none, so `gh run list` would 403 even with a token. This is what lets the
  # watchdog see whether the scheduled workflows are still firing.
  actions: read

env:
  # Placeholders: next build runs as production and validates this config.
  # Real values live in the deployment environment.
  SITE_URL: https://ci.invalid
  NEXT_PUBLIC_SITE_URL: https://ci.invalid
  NEXT_PUBLIC_CONTACT_EMAIL: ci@ci.invalid
  NEXT_PUBLIC_LEGAL_NAME: CI Build

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Deliberately not `npm ci`: the lockfile being broken is one of the
      # things being checked, so the check must survive it.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run health checks
        id: check
        continue-on-error: true
        # Without a token, every `gh` call in watchdog.mjs throws, and the
        # scheduled-workflow check -- the one that exists to notice a cron that
        # has gone quiet -- was skipped and reported as a pass on every run
        # since it was written. The reporting step below already sets this; the
        # step that does the actual checking did not.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/watchdog.mjs

      # ---- repair agent ----------------------------------------------------
      # Runs only when a workflow is actually failing, so a healthy day costs
      # nothing. It lives here rather than on a workflow_run trigger because
      # scripts/verify-security.mjs rejects workflow_run as fork-writable, and
      # that refusal is correct -- a trigger with write access to main, fired by
      # events a fork can influence, is exactly the shape worth refusing. The
      # watchdog already knows which run failed and already has a token.
      #
      # It opens a pull request. It never pushes to main. An unattended agent
      # merging its own guesses into a live site is a worse failure than the bug
      # it is chasing, and a green suite does not catch a confidently wrong fix.
      - name: Stop if a repair is already waiting
        id: repair_guard
        if: steps.check.outputs.failed_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --label repair-agent --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "::notice title=Repair agent stood down::$open repair PR(s) already open."

      - name: Diagnose the failure, and try a fix
        id: repair_agent
        if: steps.check.outputs.failed_run_id != '' && steps.repair_guard.outputs.open == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          FAILED_RUN_ID: ${{ steps.check.outputs.failed_run_id }}
          FAILED_WORKFLOW: ${{ steps.check.outputs.failed_workflow }}
        run: node scripts/repair-agent.mjs

      - name: Open a pull request with the verified fix
        if: steps.check.outputs.failed_run_id != '' && steps.repair_guard.outputs.open == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_WORKFLOW: ${{ steps.check.outputs.failed_workflow }}
          FAILED_RUN_ID: ${{ steps.check.outputs.failed_run_id }}
        run: |
          outcome=$(cat repair-outcome.txt 2>/dev/null || echo none)
          [ "$outcome" = "patch-verified" ] || { echo "No verified patch to propose."; exit 0; }

          git add -A -- . ':!repair-diagnosis.md' ':!repair-outcome.txt' ':!watchdog-report.md'
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }

          BRANCH="repair/${FAILED_RUN_ID}"
          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "fix: proposed repair for a failed ${FAILED_WORKFLOW} run

          Applied only because lint, typecheck, the test suite and a production
          build all passed with it in place. Not merged: a person decides."
          git push origin "$BRANCH"
          gh pr create --title "Proposed repair: ${FAILED_WORKFLOW}" --label repair-agent \
            --body "$(printf 'A run of **%s** failed on main. This is a proposed fix.\n\n%s\n\nIt survived `npm run lint`, `npm run typecheck`, `npm test` and `npm run build`. A patch that failed any of those is discarded and never reaches a pull request.\n\nRead it before merging: it was written by a model from failure logs, which can be confidently wrong in a way a green suite does not catch.\n' "$FAILED_WORKFLOW" "$(cat repair-diagnosis.md 2>/dev/null || echo '_No diagnosis produced._')")"

      # ---- self-healing ----------------------------------------------------
      # Only the lockfile, and only when the whole suite passes afterwards.
      # A repair that breaks the site is worse than the fault it replaced.
      - name: Repair lockfile
        id: repair
        if: steps.check.outputs.needs_lockfile_repair == 'true'
        continue-on-error: true
        run: |
          echo "Lockfile is out of sync — attempting repair."
          cp package-lock.json "$RUNNER_TEMP/lock-before.json"
          npm install --package-lock-only

          # A green suite proves the repair did not break the site. It does not
          # prove the repair only repaired: npm install is free to move any
          # dependency to a newer version inside its semver range, and this step
          # pushes straight to main. Every workflow action in this repo is
          # pinned to a SHA so nothing third-party changes without review; an
          # unattended dependency bump on the same branch undoes that.
          echo "Confirming the repair changed structure, not versions."
          node scripts/lockfile-versions.mjs --diff \
            "$RUNNER_TEMP/lock-before.json" package-lock.json

          echo "Verifying the repair before trusting it."
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Commit the repair
        if: steps.repair.outputs.verified == 'true'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "AI Student Hub Bot"
          git config user.email "ai-student-hub-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): watchdog repaired an out-of-sync lockfile

          npm ci could not resolve package-lock.json against package.json,
          which is the failure that takes every scheduled workflow down at
          once. Repaired with npm install --package-lock-only and committed
          only after lint, typecheck, tests and build all passed."
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push

      - name: Re-check after repair
        id: recheck
        if: steps.repair.outputs.verified == 'true'
        continue-on-error: true
        run: node scripts/watchdog.mjs

      # ---- reporting -------------------------------------------------------
      - name: Open, update or close the health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ steps.recheck.outcome }}" = "success" ]; then
            HEALTHY=true
          elif [ "${{ steps.recheck.outcome }}" = "failure" ]; then
            HEALTHY=false
          elif [ "${{ steps.check.outcome }}" = "success" ]; then
            HEALTHY=true
          else
            HEALTHY=false
          fi

          EXISTING=$(gh issue list --label watchdog --state open \
            --json number --jq '.[0].number // empty')

          if [ "$HEALTHY" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" \
                --body "✅ Everything is passing again. Closing automatically."
              gh issue close "$EXISTING"
              echo "Recovered — closed issue #$EXISTING."
            else
              echo "All checks passed. Nothing to report."
            fi
            exit 0
          fi

          # Ensure the label exists before the first use.
          gh label create watchdog --color B60205 \
            --description "Automated health check found a problem" 2>/dev/null || true

          BODY=$(cat watchdog-report.md)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Still failing — commented on issue #$EXISTING."
          else
            gh issue create \
              --title "🔴 Site health check failed" \
              --label watchdog \
              --body "$BODY"
            echo "Opened a new health issue."
          fi
