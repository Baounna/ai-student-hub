name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# CI only reads the repository. The org default is already read-only, but that
# is a setting someone can change in the UI; stating it here means the job keeps
# the narrow token even if the default is widened later.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # This job never pushes, so it has no use for a credential. checkout
      # otherwise leaves the token in .git/config for the rest of the job — and
      # the next step runs `npm ci`, which executes whatever install scripts the
      # checked-out package.json names. On a pull request that code came from
      # someone else's fork.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        # next build runs with NODE_ENV=production, which trips the production
        # config validation in src/lib/env-validation.ts. These are throwaway
        # placeholders so the build can be verified; the real values live in
        # the deployment environment and are never needed to compile.
        env:
          SITE_URL: https://ci.invalid
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          NEXT_PUBLIC_CONTACT_EMAIL: ci@ci.invalid
          NEXT_PUBLIC_LEGAL_NAME: CI Build
