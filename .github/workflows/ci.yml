name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        # next build runs with NODE_ENV=production, which trips the production
        # config validation in src/lib/env-validation.ts. These are throwaway
        # placeholders so the build can be verified; the real values live in
        # the deployment environment and are never needed to compile.
        env:
          SITE_URL: https://ci.invalid
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          NEXT_PUBLIC_CONTACT_EMAIL: ci@ci.invalid
          NEXT_PUBLIC_LEGAL_NAME: CI Build
          AUTH_SESSION_SECRET: ci-placeholder-session-secret-not-a-real-secret
