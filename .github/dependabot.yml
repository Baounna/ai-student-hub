# Dependency updates were entirely manual, which is how this project ended up
# with a lockfile that drifted far enough to break `npm ci` on every workflow
# for eighty days. Weekly PRs keep that from happening silently again, and they
# are the only automated route to a security patch for a transitive dependency.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps keeps the noise down; security fixes still get
      # their own so they are never buried in a batch.
      # Minor and patch only. Grouping majors here produced one PR that bundled
      # TypeScript 7, Tailwind 4, ESLint 10, Vitest 5 and @types/node 26 —
      # unmergeable as a unit, because Tailwind 3 to 4 is a rewrite of the CSS
      # setup and TypeScript 7 is not yet supported by typescript-eslint. A PR
      # that cannot be merged and cannot be split just sits there. Majors now
      # arrive one per PR, each reviewable and revertable on its own.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # Each of these fails CI by design, and reopening them weekly means a
      # failed-build email every Monday for something nobody intends to merge.
      # A notification you learn to delete unread is worse than no notification,
      # and this repo has been there before. Delete the relevant entry when the
      # migration is actually wanted — that is the signal to do the work.
      #
      # typescript 7: typescript-eslint does not support it yet, so lint exits
      # with "typescript-eslint does not support TS 7.0" before checking a file.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tailwindcss 4: a migration, not an upgrade. The config format and the
      # @tailwind directives both change, so this needs deliberate work.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # vitest 5: fails against the current test setup.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

    commit-message:
      prefix: "chore(deps)"

  # The actions themselves are a supply-chain surface: they run in CI with the
  # repository checked out.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
