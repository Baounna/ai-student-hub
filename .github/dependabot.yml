# Dependency updates were entirely manual, which is how this project ended up
# with a lockfile that drifted far enough to break `npm ci` on every workflow
# for eighty days. Weekly PRs keep that from happening silently again, and they
# are the only automated route to a security patch for a transitive dependency.
#
# That last sentence was aspirational until 22 October 2026. This file schedules
# weekly VERSION updates; a published advisory only opens its own PR if the
# repository has Dependabot alerts and automated security fixes switched on, and
# both were off. The gap showed on the day a critical Next.js RCE was published
# for 16.0.0-16.4.0 while the site ran 16.3.8: no security PR appeared, and the
# only reason the patch was available at all was that the routine Monday batch
# happened to include 16.4.2. Both settings are on now, and a security PR
# arrived within minutes of enabling them.
#
# If this file ever looks like it has stopped catching advisories, check those
# two repository settings before changing anything here. Nothing in this file
# can turn them on.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps keeps the noise down; security fixes still get
      # their own so they are never buried in a batch.
      # Minor and patch only. Grouping majors here produced one PR that bundled
      # TypeScript 7, Tailwind 4, ESLint 10, Vitest 5 and @types/node 26 —
      # unmergeable as a unit, because Tailwind 3 to 4 is a rewrite of the CSS
      # setup and TypeScript 7 is not yet supported by typescript-eslint. A PR
      # that cannot be merged and cannot be split just sits there. Majors now
      # arrive one per PR, each reviewable and revertable on its own.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # Each of these fails CI by design, and reopening them weekly means a
      # failed-build email every Monday for something nobody intends to merge.
      # A notification you learn to delete unread is worse than no notification,
      # and this repo has been there before. Delete the relevant entry when the
      # migration is actually wanted — that is the signal to do the work.
      #
      # typescript 7: typescript-eslint does not support it yet, so lint exits
      # with "typescript-eslint does not support TS 7.0" before checking a file.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tailwindcss 4: a migration, not an upgrade. The config format and the
      # @tailwind directives both change, so this needs deliberate work.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # vitest 5: fails against the current test setup.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # eslint 10: eslint-plugin-react has not caught up with the new rule
      # loading API — "TypeError: contextOrFilename.getFilename is not a
      # function" while loading react/display-name, before a single file is
      # checked. Upstream, not ours to fix; remove this entry once the plugin
      # ships ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

    commit-message:
      prefix: "chore(deps)"

  # The actions themselves are a supply-chain surface: they run in CI with the
  # repository checked out.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # security-codeql.yml pins init, autobuild and analyze to the same SHA,
      # and CodeQL requires them to match. Ungrouped, Dependabot raised one PR
      # per action -- #47, #48, #49 -- and each was unmergeable on its own:
      # whichever landed first would leave the other two behind and fail the
      # workflow with "configuration error", which names neither the version
      # nor the cause. Three PRs that are only correct as a set should be one
      # PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "chore(ci)"
