<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI and Cybersecurity News">
  <!--
    The site's mark is the small pine dot with a soft halo that sits before the
    wordmark in the header (layout.tsx, .brand-orb). This is that mark, inverted
    so it survives a 16px browser tab: a solid pine field with a paper dot and
    ring, rather than a pale field with a small dark dot that would vanish.

    It replaces a navy to #2F7CFF gradient tile with a cyan accent dot, an older
    blue identity that appears nowhere on the site any more. This file is not
    only the tab icon: it is also the manifest icon and the publisher.logo in
    every article's JSON-LD, so that blue tile was what Google's rich results
    showed for a site that is pine and paper throughout.
  -->
  <rect width="512" height="512" rx="112" fill="#1b4d3e" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="16" />
  <circle cx="256" cy="256" r="84" fill="#ffffff" />
</svg>
