<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI and Cybersecurity News">
  <!--
    Four petals on a square grid, each drawn from the centre out to a point.

    This replaces a ring-and-dot mark that was drawn at 512px and never checked
    at 16. Its ring was stroke-width 16, which is 0.5px in a browser tab, so the
    browser blurred it away and what survived was a green square with a dot in
    it -- a record button, not a publication.

    The construction is four identical quadratic curves rotated 90 degrees
    around the centre, so the mark is generated by a rule rather than drawn by
    eye, and it scales by that rule. Points rather than circles because a point
    carries direction and a circle carries none; the earlier version used plain
    overlapping circles and read as a default app icon.

    This file is not only the tab icon. It is also the manifest icon and the
    publisher.logo in every article's JSON-LD, which is what Google shows beside
    a search result, so the four raster files in public/ must be regenerated
    from it rather than left as the old mark.
  -->
  <rect width="512" height="512" rx="112" fill="#1b4d3e" />
  <g fill="#ffffff">
    <path d="M256 256 Q178 202 256 96 Q334 202 256 256 Z" />
    <path d="M256 256 Q310 178 416 256 Q310 334 256 256 Z" />
    <path d="M256 256 Q334 310 256 416 Q178 310 256 256 Z" />
    <path d="M256 256 Q202 334 96 256 Q202 178 256 256 Z" />
  </g>
</svg>
